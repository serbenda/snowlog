# Snowlog desktop version: its own window (no browser) with the same web app inside.
# GitHub Actions builds it (.github/workflows/desktop.yml) for Windows, macOS and Linux.
[package]
name = "snowlog"
version = "0.2.0"
description = "Encrypted notebook"
authors = ["Sergio Santiago Bendaña Quesada"]
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Small executable
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
