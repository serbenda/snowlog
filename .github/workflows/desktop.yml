# Versión de escritorio con Tauri: una ventana propia con la web dentro, sin navegador.
# Compila un ejecutable para cada sistema y los deja como artefactos de la ejecución:
#   Windows: snowlog-windows.exe (se abre sin instalar; usa el motor de Edge que trae Windows)
#   macOS:   snowlog-macos.zip con Snowlog.app para Intel y Apple Silicon (sin firmar)
#   Linux:   snowlog-linux.AppImage
name: Escritorio

on:
  push:
    branches: [development]
    paths:
      - 'desktop/**'
      - 'public/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
            args: --no-bundle
          - nombre: macOS
            os: macos-latest
            args: --bundles app --target universal-apple-darwin
          - nombre: Linux
            os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Librerías de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust para Intel y Apple Silicon
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Iconos
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 icon icon.png

      - name: Compilar
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.args }}

      - name: Preparar el ejecutable
        shell: bash
        run: |
          mkdir -p salida
          T=desktop/src-tauri/target
          case "${{ runner.os }}" in
            Windows) cp "$T/release/snowlog.exe" salida/snowlog-windows.exe ;;
            macOS) ditto -c -k --keepParent "$T/universal-apple-darwin/release/bundle/macos/Snowlog.app" salida/snowlog-macos.zip ;;
            Linux) cp "$T"/release/bundle/appimage/*.AppImage salida/snowlog-linux.AppImage ;;
          esac
          ls -la salida

      # Prueba de humo en una pantalla virtual: la app arranca, sigue abierta y pinta algo.
      - name: Abrir la app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick
          chmod +x salida/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a -s "-screen 0 1280x820x24" bash -c '
            salida/*.AppImage & pid=$!
            sleep 20
            kill -0 "$pid" || { echo "La app se ha cerrado al arrancar"; exit 1; }
            import -window root captura.png
            kill "$pid"
            convert captura.png -format "%[fx:standard_deviation]" info: > variacion.txt'
          echo "Variación de la captura: $(cat variacion.txt)"
          awk '{ exit !($1 > 0.02) }' variacion.txt || { echo "La ventana sale vacía"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: snowlog-${{ matrix.nombre }}
          path: salida/*
          if-no-files-found: error
          retention-days: 30
