# Desktop version with Tauri: a window of its own with the web app inside, no browser.
# Builds an executable for each system and leaves them as artifacts of the run:
#   Windows: snowlog-windows.exe (opens without installing; uses the Edge engine that comes with Windows)
#   macOS:   snowlog-macos.zip with Snowlog.app for Intel and Apple Silicon (unsigned)
#   Linux:   snowlog-linux.AppImage
name: Desktop

on:
  push:
    branches: [development]
    paths:
      - 'desktop/**'
      - 'public/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --no-bundle
          - name: macOS
            os: macos-latest
            args: --bundles app --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write      # to sign the provenance attestation
      attestations: write  # to store it in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust for Intel and Apple Silicon
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The Tauri CLI, at the versions in desktop/package-lock.json (checked against their hashes), with no
      # install scripts.
      - name: Tauri CLI
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Icons
        working-directory: desktop
        run: npx --no-install tauri icon icon.png

      # With desktop/src-tauri/Cargo.lock in the repository, the Rust crates are the ones it pins (--locked).
      # Without it (the first time), the build resolves them and the Linux job leaves the lockfile as an artifact
      # ("cargo-lock") to commit.
      - name: Build
        id: build
        working-directory: desktop
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.lock ]; then locked=--locked; echo "generated=no" >> "$GITHUB_OUTPUT"
          else locked=; echo "generated=yes" >> "$GITHUB_OUTPUT"; fi
          npx --no-install tauri build ${{ matrix.args }} -- $locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: runner.os == 'Linux' && steps.build.outputs.generated == 'yes'
        with:
          name: cargo-lock
          path: desktop/src-tauri/Cargo.lock
          retention-days: 7

      - name: Prepare the executable
        shell: bash
        run: |
          mkdir -p out
          T=desktop/src-tauri/target
          case "${{ runner.os }}" in
            Windows) cp "$T/release/snowlog.exe" out/snowlog-windows.exe ;;
            macOS) ditto -c -k --keepParent "$T/universal-apple-darwin/release/bundle/macos/Snowlog.app" out/snowlog-macos.zip ;;
            Linux) cp "$T"/release/bundle/appimage/*.AppImage out/snowlog-linux.AppImage ;;
          esac
          ls -la out

      # Smoke test (Linux, virtual screen): the app opens its window and the web app inside starts.
      # Done over WebDriver with tauri-driver, which asks the page instead of looking at pixels.
      - name: Open the app and check the web app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb webkit2gtk-driver
          cargo install tauri-driver --version 2.1.0 --locked
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a -s "-screen 0 1280x820x24" bash -c '
            tauri-driver > driver.log 2>&1 &
            node desktop/smoke-test.mjs "$PWD/desktop/src-tauri/target/release/snowlog" "$0" || { cat driver.log; exit 1; }' \
            '!document.getElementById("lock").hidden || !document.getElementById("app").hidden'

      # Signed provenance for each executable (gh attestation verify <file> -R serbenda/snowlog).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: snowlog-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
