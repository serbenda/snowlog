name = "snowlog-auth"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Origen de la web publicada en GitHub Pages, sin barra final.
ALLOWED_ORIGIN = "https://bendi.dev"
# Client ID de la GitHub App (no es secreto).
GITHUB_CLIENT_ID = ""

# El client secret NO va aquí. Guárdalo con:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
